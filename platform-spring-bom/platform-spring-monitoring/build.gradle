dependencies {
    implementation project(':platform-spring-bom:platform-spring-context')

    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // API to be able to implement own HealthIndicators
    api 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.springframework.security:spring-security-config'
    compileOnly 'org.springframework.security:spring-security-web'
    // EndpointRequest moved to the spring-boot-security module in Spring Boot 4
    compileOnly 'org.springframework.boot:spring-boot-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
